name: Auto Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.github/**'

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      # Not --strict: two exact-version pins in require would fail it
      - name: Run verification checks
        run: composer validate

      # Decide the bump from every commit this push brings in, not just the
      # merge commit: a GitHub merge commit only carries the PR title, so
      # breaking-change markers on the individual commits would be missed.
      - name: Determine version bump type
        id: version-type
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # First push to the branch, or a force push: fall back to the first parent
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            BEFORE="HEAD^1"
          fi
          RANGE="$BEFORE..HEAD"

          MESSAGES=$(git log --format=%B "$RANGE")
          SUBJECTS=$(git log --format=%s "$RANGE")
          # Branch prefixes of the merged PRs, e.g. "feature" from "from Org/feature/sc-123--x"
          PREFIXES=$(echo "$SUBJECTS" | sed -nE 's|^Merge pull request #[0-9]+ from [^/]+/([^/ ]+)/.*|\1|p')

          VERSION_TYPE="patch"

          # Conventional Commits: "type!:" / "type(scope)!:" or a BREAKING CHANGE footer.
          # Lines are matched anywhere in the messages so PR titles on merge commits and
          # the "* type: ..." lists of squash merges count too.
          if echo "$MESSAGES" | grep -qE '^(\* )?[a-z]+(\([^)]*\))?!: ' \
            || echo "$MESSAGES" | grep -qE '^BREAKING[ -]CHANGE: ' \
            || echo "$PREFIXES" | grep -qE '^(major|breaking)$'; then
            VERSION_TYPE="major"
          elif echo "$MESSAGES" | grep -qE '^(\* )?feat(\([^)]*\))?: ' \
            || echo "$PREFIXES" | grep -qE '^(feat|feature|minor)$'; then
            VERSION_TYPE="minor"
          fi

          echo "Commits in $RANGE:"
          echo "$SUBJECTS" | sed 's/^/  /'
          echo "Version bump: $VERSION_TYPE"

          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check if version should be bumped
        id: should-release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"chore(release):"* ]] || [[ "$COMMIT_MSG" == *"bump version"* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current version and bump
        id: version
        if: steps.should-release.outputs.should_release == 'true'
        run: |
          SEMVER_TAGS=$(git tag --list | awk '
            /^v?[0-9]+\.[0-9]+\.[0-9]+$/ {
              version = $0
              sub(/^v/, "", version)
              print version "\t" $0
            }
          ' | sort -V)
          LATEST_TAG=$(echo "$SEMVER_TAGS" | tail -n 1 | cut -f 2)
          CURRENT_TAG=$(git tag --points-at HEAD | awk '
            /^v?[0-9]+\.[0-9]+\.[0-9]+$/ {
              version = $0
              sub(/^v/, "", version)
              print version "\t" $0
            }
          ' | sort -V | tail -n 1 | cut -f 2)

          if [ -n "$CURRENT_TAG" ]; then
            NEW_VERSION=${CURRENT_TAG#v}
            PREVIOUS_TAG=$(echo "$SEMVER_TAGS" | awk -v current="$NEW_VERSION" '
              $1 == current { exit }
              { previous = $2 }
              END { print previous }
            ')
            OLD_VERSION=${PREVIOUS_TAG#v}
            OLD_VERSION=${OLD_VERSION:-0.0.0}
            TAG_EXISTS=true
          else
            PREVIOUS_TAG=$LATEST_TAG
            OLD_VERSION=${LATEST_TAG#v}
            OLD_VERSION=${OLD_VERSION:-0.0.0}
            TAG_EXISTS=false

            if [[ ! $OLD_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Error: Invalid version format '$OLD_VERSION'" >&2
              exit 1
            fi

            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}

            case ${{ steps.version-type.outputs.version_type }} in
              "major") MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              "minor") MINOR=$((MINOR + 1)); PATCH=0 ;;
              "patch") PATCH=$((PATCH + 1)) ;;
            esac

            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.should-release.outputs.should_release == 'true' && steps.version.outputs.tag_exists != 'true'
        run: |
          git tag "${{ steps.version.outputs.new_version }}"
          git push origin "refs/tags/${{ steps.version.outputs.new_version }}"

      - name: Generate changelog
        if: steps.should-release.outputs.should_release == 'true'
        id: changelog
        run: |
          PREVIOUS_TAG="${{ steps.version.outputs.previous_tag }}"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### Changes since $PREVIOUS_TAG" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD >> CHANGELOG.md
          else
            echo "### Initial Release" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "This is the first tagged release of oak." >> CHANGELOG.md
          fi

          CHANGELOG_CONTENT=$(cat CHANGELOG.md)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.should-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## Release ${{ steps.version.outputs.new_version }}

            **Version bump**: ${{ steps.version.outputs.old_version }} -> ${{ steps.version.outputs.new_version }} (${{ steps.version-type.outputs.version_type }})

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            ```bash
            composer require tallieutallieu/oak:^${{ steps.version.outputs.new_version }}
            ```

            ### Usage

            ```php
            $app = new \Oak\Application();

            $app->bootstrap();
            ```
          draft: false
          prerelease: false
